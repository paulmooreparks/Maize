name: CI

on:
  # maize-318: CI moved off the per-push trigger (every card merge no longer
  # fires a ~27-minute three-job run) to a nightly batch plus an on-demand
  # trigger. workflow_dispatch now covers the on-demand role the old
  # merge-check/** push trigger (maize-257) served, so that trigger is
  # removed rather than kept alongside it. There is no pull_request trigger
  # to reconcile: card work lands on `dev` through the Merge stage rather
  # than through a pull request, and `master` moves only when a cut
  # promotes accepted work (maize-436).
  #
  # maize-388: every checkout step below carries an explicit `ref`, and the
  # nightly does not work without it. A schedule event always runs the default
  # branch's copy of a workflow, and when no `ref` is given the checkout
  # inherits that same branch, so this cron had been validating `master` from
  # the day it shipped. `master` only moves at a cut, and a cut already runs
  # its own release checks before promoting, so a nightly there re-checks work
  # that was checked hours earlier. `dev` is the line that moves every time a
  # card merges and has nothing between merges, which is where a nightly
  # regression check earns its keep. The expression leaves workflow_dispatch
  # alone: it resolves to `github.sha`, the commit the dispatch already
  # selected. Every job then prints what it actually checked out, in a step
  # named "Report the checked-out ref and commit", because a run's own
  # metadata cannot report that and a reader needs somewhere to look.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# maize-450: every job here builds the v2 targets and runs the v2 tests, and nothing
# else. v1 is archived and gets no further development or testing, so the steps that
# built the cproc and qbe C cross-toolchain, the ones that ran scripts/run-tests.sh and
# scripts/run-tests.ps1, and the MAIZE_CC wiring that pointed the guest suite at mzcc are
# all gone. The submodule checkout goes with them: toolchain/cproc and toolchain/qbe exist
# only to build v1 guest code, so no job needs to fetch them.
#
# Each job configures with a preset, builds untargeted, and runs ctest with no label
# filter. The untargeted build is deliberate: after maize-450 the preset's whole target
# set IS the v2 set, so naming targets here would be a second list to keep in sync with
# CMakeLists for no benefit. The unfiltered ctest is deliberate for the same reason, and
# it is also the check that the v1 suite really is unregistered rather than merely
# deselected. A `-L v2` filter would pass either way.
#
# ctest runs SERIALLY on every leg. Several v2_mzasm_* fixtures share a scratch path and
# collide under -j (maize-444), so the old -j$(nproc-2) on the two Linux legs would report
# failures that say nothing about the code. The whole suite is roughly 15 seconds serial,
# so there is nothing to buy back here.
#
# --no-tests=error (CTest 3.19+, and this project requires 3.21) stays on every leg and is
# not optional. ctest's default is to print "No tests were found!!!" and exit 0, so a
# configure that registered nothing would turn a leg green having verified nothing at all.

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      # maize-388: see the note under `on:`. A schedule run checks out `dev`;
      # every other event keeps the commit it was triggered on.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}

      # maize-388: this step is permanent, and it exists because nothing else in
      # a run's metadata can answer the question the checkout ref was added to
      # settle. GitHub records a scheduled run against the default branch, so
      # `gh run list --event schedule` reports `master` however the checkout
      # resolved, and a reader filtering on that branch sees an empty list
      # whether the ref works or is broken. The log line below is the only place
      # the answer appears, so a reader opens the run and reads it rather than
      # inferring it from metadata that cannot carry it.
      - name: Report the checked-out ref and commit
        shell: bash
        run: |
          echo "event:        ${{ github.event_name }}"
          echo "ref resolved: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}"
          echo "HEAD commit:  $(git rev-parse HEAD)"
          echo "HEAD subject: $(git log -1 --pretty=%s)"

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure and build (Debug)
        run: |
          cmake --preset linux-debug
          cmake --build build/linux-debug

      - name: Run the v2 suite (Debug)
        run: ctest --test-dir build/linux-debug --output-on-failure --no-tests=error

      # maize-242: a Release-preset leg catches optimization-general regressions (for
      # instance FP tie-rounding that only mis-rounds under -O2+/LTO) that the Debug leg
      # above cannot see. The defect that motivated it sat undetected since maize-237
      # because no CI leg built Release on either platform, and the reasoning applies to
      # the v2 interpreter exactly as it applied to v1's.
      - name: Configure and build (Release)
        run: |
          cmake --preset linux-release
          cmake --build build/linux-release

      - name: Run the v2 suite (Release)
        run: ctest --test-dir build/linux-release --output-on-failure --no-tests=error

  linux-sanitizers:
    runs-on: ubuntu-latest
    env:
      # Leak detection is on. The suppression this job used to carry,
      # detect_leaks=0, was forced by v1's mzcc holding its argument-parsing
      # state at exit, and maize-386 freed that; maize-450 then took mzcc out
      # of the build entirely, so what this leg now runs is the v2 suite alone
      # and it is leak-clean. LeakSanitizer defaults to on for ASan on Linux,
      # so naming only abort_on_error here is enough; keep it that way rather
      # than reintroducing a suppression.
      ASAN_OPTIONS: abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      # maize-388: see the note under `on:`. A schedule run checks out `dev`;
      # every other event keeps the commit it was triggered on.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}

      # maize-388: permanent, for the reason given in the `linux` job above.
      - name: Report the checked-out ref and commit
        shell: bash
        run: |
          echo "event:        ${{ github.event_name }}"
          echo "ref resolved: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}"
          echo "HEAD commit:  $(git rev-parse HEAD)"
          echo "HEAD subject: $(git log -1 --pretty=%s)"

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # MAIZE_SANITIZE instruments mzvm, mzvmg and mzasm, and cmake/MaizeV2Fixtures.cmake
      # instruments the two fixture binaries with the same flags, so this leg runs the
      # whole v2 suite through ASan and UBSan.
      - name: Configure and build (ASan + UBSan)
        run: |
          cmake --preset linux-asan-ubsan
          cmake --build build/linux-asan-ubsan

      - name: Run the v2 suite under ASan + UBSan
        run: ctest --test-dir build/linux-asan-ubsan --output-on-failure --no-tests=error

  windows:
    runs-on: windows-latest
    # maize-439: the toolchain installs outside the repository, at a per-user
    # version-keyed location, with MAIZE_TOOLCHAIN_ROOT overriding where that is. CI
    # sets the override to a workspace-relative directory rather than using the
    # runner's real %LOCALAPPDATA% so the cache path is explicit and stays the same
    # across runner images. Every step in this job inherits it, which is what keeps
    # the bootstrap and the CMake presets agreeing on one directory.
    env:
      MAIZE_TOOLCHAIN_ROOT: ${{ github.workspace }}\.ci-toolchains
    steps:
      # maize-388: see the note under `on:`. A schedule run checks out `dev`;
      # every other event keeps the commit it was triggered on.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}

      # maize-388: permanent, for the reason given in the `linux` job above.
      - name: Report the checked-out ref and commit
        shell: bash
        run: |
          echo "event:        ${{ github.event_name }}"
          echo "ref resolved: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}"
          echo "HEAD commit:  $(git rev-parse HEAD)"
          echo "HEAD subject: $(git log -1 --pretty=%s)"

      # maize-439: the one thing that holds the three toolchain resolvers to a single
      # answer. PowerShell, POSIX sh and CMake each implement the resolution order
      # because they cannot source each other's code, and divergence between them is
      # the whole risk of that shape; this fixture populates several candidate
      # locations at once with distinguishable probe bytes and asserts all three pick
      # the same correctly-higher-precedence winner, across seven scenarios. It is
      # machine-agnostic infrastructure rather than v1 tooling, so maize-450 leaves it
      # exactly where it is.
      #
      # It runs HERE because this is the only job with both of its prerequisites,
      # PowerShell and cmake, and it exits 2 rather than passing when either is
      # missing, so a Linux leg would report a failure rather than a hollow pass.
      # It runs FIRST because it needs neither the toolchain nor a build, so a
      # divergence fails the job in seconds instead of after a bootstrap and two
      # full builds. Do not move it below the bootstrap; it deliberately does not
      # depend on one.
      - name: Toolchain resolver agreement (three implementations, one order)
        shell: bash
        run: scripts/test-toolchain-resolution.sh

      # Keyed on the pin file rather than on the bootstrap script (maize-439): the pin
      # is what decides which archive is fetched, so a script edit that changes no
      # version no longer throws the cache away, and a version bump still does.
      - name: Cache llvm-mingw toolchain
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.ci-toolchains
          key: llvm-mingw-${{ hashFiles('scripts/toolchain-pins/llvm-mingw.pin') }}

      - name: Bootstrap llvm-mingw toolchain
        run: scripts/bootstrap-toolchain.ps1

      - name: Ensure ninja is available
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }

      - name: Configure and build (Debug)
        run: |
          cmake --preset windows-llvm-mingw-debug
          cmake --build build/windows-llvm-mingw-debug

      - name: Run the v2 suite (Debug)
        run: ctest --test-dir build/windows-llvm-mingw-debug --output-on-failure --no-tests=error

      # maize-242: Release-preset leg on the llvm-mingw (clang) toolchain. The
      # tie-rounding defect that motivated this reproduced on BOTH clang and gcc
      # Release builds, so the guard belongs on both platforms rather than one.
      - name: Configure and build (Release)
        run: |
          cmake --preset windows-llvm-mingw-release
          cmake --build build/windows-llvm-mingw-release

      - name: Run the v2 suite (Release)
        run: ctest --test-dir build/windows-llvm-mingw-release --output-on-failure --no-tests=error
